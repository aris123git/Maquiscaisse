workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      android_signing:
        - debug_keystore
      vars:
        PACKAGE_NAME: "com.example.maquiscaisse"
      java: 17

    scripts:
      - name: Build APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
